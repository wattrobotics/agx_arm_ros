default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# 값은 Nero(v111) 실제 모터 한계(get_joint_angle_vel_limits / get_joint_acc_limits) 그대로(100%).
# 실측 한계: j1~2 spd=3.14 acc=2.0 / j3~4 spd=3.14 acc=2.5 / j5~7 spd=3.92 acc=2.5 (rad, rad/s, rad/s^2)
joint_limits:
  joint1:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint2:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint3:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 2.5
  joint4:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 2.5
  joint5:
    has_velocity_limits: true
    max_velocity: 3.92
    has_acceleration_limits: true
    max_acceleration: 2.5
  joint6:
    has_velocity_limits: true
    max_velocity: 3.92
    has_acceleration_limits: true
    max_acceleration: 2.5
  joint7:
    has_velocity_limits: true
    max_velocity: 3.92
    has_acceleration_limits: true
    max_acceleration: 2.5
  gripper_joint1:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
